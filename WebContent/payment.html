<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanh toán — Book Store</title>
<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/bookshelf-theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
.checkout-form-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 36px;
	margin-bottom: 24px;
}
@media (max-width: 768px) {
	.checkout-form-grid {
		grid-template-columns: 1fr;
		gap: 20px;
	}
}
.checkout-section-title {
	font-family: 'Playfair Display', serif;
	font-size: 1.25rem;
	font-weight: 700;
	color: var(--text-primary);
	margin-bottom: 18px;
	padding-bottom: 8px;
	border-bottom: 1px solid rgba(197, 137, 64, 0.2);
}
.checkout-input-field {
	margin-bottom: 16px;
}
.checkout-input-field label {
	display: block;
	font-weight: 600;
	font-size: 0.88rem;
	color: var(--text-primary);
	margin-bottom: 6px;
}
.checkout-input-field input {
	width: 100%;
	padding: 11px 15px;
	border: 1px solid rgba(197, 137, 64, 0.25);
	border-radius: 10px;
	font-size: 0.95rem;
	outline: none;
	transition: all 0.2s ease;
	background: #fff;
}
.checkout-input-field input:focus {
	border-color: var(--accent-primary);
	box-shadow: 0 0 0 3px rgba(197, 137, 64, 0.15);
}
.checkout-row-2 {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 16px;
}
.card-icons-wrap {
	display: flex;
	gap: 12px;
	font-size: 26px;
	margin-bottom: 16px;
}
.checkout-total-bar {
	margin-top: 24px;
	padding: 20px 24px;
	background: var(--bg-board);
	border-radius: var(--radius-card);
	border: 1px solid rgba(197, 137, 64, 0.2);
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 16px;
}
.checkout-total-bar .btn {
	background: var(--accent-primary) !important;
	color: #fff !important;
	border: 0 !important;
	padding: 12px 32px !important;
	border-radius: var(--radius-pill) !important;
	font-weight: 700 !important;
	font-size: 1rem !important;
	cursor: pointer;
	box-shadow: 0 6px 16px rgba(197, 137, 64, 0.28);
	transition: all 0.2s ease;
}
.checkout-total-bar .btn:hover {
	background: var(--accent-hover) !important;
	transform: translateY(-2px);
}
</style>
</head>
<body class="customer-bookshelf-body">
	<header class="bookshelf-header-wrap">
		<nav class="navbar-bookshelf">
			<a class="brand" href="viewbook">BOOKS</a>
			<div class="pill-tabs">
				<a href="viewbook" id="home">Trang chủ</a>
				<a href="viewbook" id="books">Sách có sẵn</a>
				<a href="orders" id="orders">Lịch sử đơn hàng</a>
				<a href="about" id="about">Giới thiệu</a>
			</div>
			<div class="nav-icon-group">
				<a href="cart" id="cart" class="nav-pill-btn active" title="Xem giỏ hàng">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
					<span>Giỏ hàng</span>
				</a>
				<a href="logout" id="logout" class="nav-pill-btn nav-logout-btn" title="Đăng xuất">
					<span class="nav-avatar"></span>
					<span>Đăng xuất</span>
				</a>
			</div>
		</nav>
	</header>

	<div class="bookshelf-page-container">
		<div class="bookshelf-page-card">
			<header class="bookshelf-page-header">
				<h1>Thanh toán an toàn</h1>
				<p>Nhập thông tin giao hàng và thanh toán để hoàn tất đơn đặt hàng.</p>
			</header>

			<div class="checkout-form-container">
				<form action="pay" method="post">
					<div class="checkout-form-grid">
						<!-- Billing Address Column -->
						<div>
							<h3 class="checkout-section-title"><i class="fa fa-map-marker"></i> Địa chỉ nhận hàng & thanh toán</h3>
							<div class="checkout-input-field">
								<label for="fname">Họ và tên</label>
								<input type="text" id="fname" name="firstname" placeholder="Nguyễn Văn A" required>
							</div>
							<div class="checkout-input-field">
								<label for="email">Địa chỉ Email</label>
								<input type="text" id="email" name="email" placeholder="nguyenvana@example.com" required>
							</div>
							<div class="checkout-input-field">
								<label for="adr">Địa chỉ (Số nhà, tên đường)</label>
								<input type="text" id="adr" name="address" placeholder="Số 123 đường Cầu Giấy" required>
							</div>
							<div class="checkout-input-field">
								<label for="city">Tỉnh / Thành phố</label>
								<input type="text" id="city" name="city" placeholder="Hà Nội" required>
							</div>
							<div class="checkout-row-2">
								<div class="checkout-input-field">
									<label for="state">Quận / Huyện</label>
									<input type="text" id="state" name="state" placeholder="Cầu Giấy" required>
								</div>
								<div class="checkout-input-field">
									<label for="zip">Mã bưu điện</label>
									<input type="text" id="zip" name="zip" placeholder="100000" required>
								</div>
							</div>
						</div>

						<!-- Payment Details Column -->
						<div>
							<h3 class="checkout-section-title"><i class="fa fa-credit-card"></i> Phương thức thanh toán</h3>
							<label style="font-weight:600; font-size:0.88rem;">Thẻ được chấp nhận</label>
							<div class="card-icons-wrap">
								<i class="fa fa-cc-visa" style="color: #1a1f71;"></i>
								<i class="fa fa-cc-amex" style="color: #006fcf;"></i>
								<i class="fa fa-cc-mastercard" style="color: #eb001b;"></i>
								<i class="fa fa-cc-discover" style="color: #ff6000;"></i>
							</div>

							<div class="checkout-input-field">
								<label for="cname">Tên in trên thẻ</label>
								<input type="text" id="cname" name="cardname" placeholder="NGUYEN VAN A" required>
							</div>
							<div class="checkout-input-field">
								<label for="ccnum">Số thẻ tín dụng</label>
								<input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" required>
							</div>
							<div class="checkout-row-2">
								<div class="checkout-input-field">
									<label for="expmonth">Tháng hết hạn</label>
									<input type="text" id="expmonth" name="expmonth" placeholder="09" required>
								</div>
								<div class="checkout-input-field">
									<label for="expyear">Năm hết hạn</label>
									<input type="text" id="expyear" name="expyear" placeholder="2026" required>
								</div>
							</div>
							<div class="checkout-input-field">
								<label for="cvv">Mã CVV</label>
								<input type="text" id="cvv" name="cvv" placeholder="352" required>
							</div>
						</div>
					</div>

					<label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:20px; font-size:0.9rem;">
						<input type="checkbox" checked="checked" name="sameadr"> Địa chỉ nhận hàng trùng với địa chỉ thanh toán
					</label>

					<div class="checkout-total-bar">

				
</body>
</html>
