<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng Ký Tài Khoản Bạn Đọc — Hiệu Sách Trực Tuyến</title>
<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="manifest" href="./favicons/site.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/bookshelf-theme.css">
<style>
.register-grid-2 {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 16px;
}
@media (max-width: 540px) {
	.register-grid-2 {
		grid-template-columns: 1fr;
		gap: 0;
	}
}
.btn-auth-submit {
	width: 100%;
	padding: 13px;
	border-radius: var(--radius-pill);
	background: var(--accent-primary);
	color: #fff;
	border: 0;
	font-weight: 700;
	font-size: 1rem;
	cursor: pointer;
	box-shadow: 0 6px 16px rgba(197, 137, 64, 0.25);
	transition: all 0.2s ease;
	margin-top: 10px;
}
.btn-auth-submit:hover {
	background: var(--accent-hover);
	transform: translateY(-1px);
}
.auth-switch-link {
	text-align: center;
	margin-top: 20px;
	font-size: 0.9rem;
	color: var(--text-secondary);
}
.auth-switch-link a {
	color: var(--accent-hover);
	font-weight: 600;
	text-decoration: none;
}
.auth-switch-link a:hover {
	text-decoration: underline;
}
textarea.bookshelf-textarea {
	width: 100%;
	padding: 12px 16px;
	border-radius: 12px;
	border: 1px solid rgba(197, 137, 64, 0.25);
	background: #fff;
	color: var(--text-primary);
	font-family: 'Plus Jakarta Sans', sans-serif;
	font-size: 0.95rem;
	outline: none;
	resize: vertical;
	min-height: 70px;
	transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
textarea.bookshelf-textarea:focus {
	border-color: var(--accent-primary);
	box-shadow: 0 0 0 3px rgba(197, 137, 64, 0.15);
}
</style>
</head>
<body class="customer-bookshelf-body" onload="funload()">
	<header class="bookshelf-header-wrap">
		<nav class="navbar-bookshelf">
			<a class="brand" href="index.html">BOOKS</a>
			<div class="pill-tabs">
				<a href="index.html">Trang chủ</a>
				<a href="CustomerLogin.html">Đăng nhập</a>
				<a href="CustomerRegister.html" class="active">Đăng ký</a>
			</div>
			<div class="nav-icon-group">
				<a href="CustomerLogin.html" class="nav-pill-btn" style="font-size:0.82rem;">Đăng nhập &rarr;</a>
			</div>
		</nav>
	</header>

	<div class="bookshelf-auth-wrap" style="max-width: 540px;">
		<div class="bookshelf-page-card">
			<header class="bookshelf-page-header" style="text-align:center;">
				<h1>Tạo Tài Khoản Mới</h1>
				<p>Đăng ký thành viên để khám phá thế giới tri thức và nhận các gợi ý sách dành riêng cho bạn.</p>
			</header>

			<div id="authAlertBox"></div>

			<form action="userreg" method="post">
				<div class="register-grid-2">
					<div class="bookshelf-input-group">
						<label for="firstName">Họ đệm</label>
						<input type="text" name="firstname" id="firstName" placeholder="Nguyễn Văn" required>
					</div>
					<div class="bookshelf-input-group">
						<label for="lastName">Tên</label>
						<input type="text" name="lastname" id="lastName" placeholder="An" required>
					</div>
				</div>

				<div class="bookshelf-input-group">
					<label for="username">Tên tài khoản (Username)</label>
					<input type="text" name="username" id="username" placeholder="Ví dụ: vanan2026" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="Email">Địa chỉ Email</label>
					<input type="email" name="mailid" id="Email" placeholder="an@example.com" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="passWord">Mật khẩu</label>
					<input type="password" name="password" id="passWord" placeholder="Tạo mật khẩu an toàn" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="phno">Số điện thoại</label>
					<input type="tel" name="phone" id="phno" placeholder="Ví dụ: 0912345678" pattern="[0-9+\-\s()]+" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="address">Địa chỉ giao hàng</label>
					<textarea name="address" id="address" class="bookshelf-textarea" placeholder="Nhập đầy đủ số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
				</div>

				<label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin: 12px 0 20px; font-size:0.88rem; color:var(--text-secondary);">
					<input type="checkbox" name="acceptance" required checked>
					Tôi đồng ý với tất cả Điều khoản &amp; Điều kiện dịch vụ
				</label>

				<button class="btn-auth-submit" type="submit">Hoàn Tất Đăng Ký</button>

				<div class="auth-switch-link">
					Đã có tài khoản? <a href="CustomerLogin.html">Đăng nhập tại đây</a>
				</div>
			</form>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
	<script>
		function funload() {
			try {
				var params = new URLSearchParams(window.location.search);
				var error = params.get('error');
				if (error) {
					var alertBox = document.getElementById('authAlertBox');
					if (alertBox) {
						alertBox.innerHTML = '<div class="alert alert-danger text-center" style="border-radius:12px; margin-bottom:18px; font-weight:600;">' + decodeURIComponent(error) + '</div>';
					}
				}
			} catch (e) {
				console.error(e);
			}
		}
	</script>
</body>
</html>
