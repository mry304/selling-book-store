<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="ISO-8859-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Registration — Book Store</title>
<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="manifest" href="./favicons/site.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/bookshelf-theme.css">
<style>
.register-grid-2 {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 16px;
}
@media (max-width: 540px) {
	.register-grid-2 {
		grid-template-columns: 1fr;
		gap: 0;
	}
}
.btn-auth-submit {
	width: 100%;
	padding: 13px;
	border-radius: var(--radius-pill);
	background: var(--accent-primary);
	color: #fff;
	border: 0;
	font-weight: 700;
	font-size: 1rem;
	cursor: pointer;
	box-shadow: 0 6px 16px rgba(197, 137, 64, 0.25);
	transition: all 0.2s ease;
	margin-top: 10px;
}
.btn-auth-submit:hover {
	background: var(--accent-hover);
	transform: translateY(-1px);
}
.auth-switch-link {
	text-align: center;
	margin-top: 20px;
	font-size: 0.9rem;
	color: var(--text-secondary);
}
.auth-switch-link a {
	color: var(--accent-hover);
	font-weight: 600;
	text-decoration: none;
}
.auth-switch-link a:hover {
	text-decoration: underline;
}
textarea.bookshelf-textarea {
	width: 100%;
	padding: 12px 16px;
	border-radius: 12px;
	border: 1px solid rgba(197, 137, 64, 0.25);
	background: #fff;
	color: var(--text-primary);
	font-family: 'Plus Jakarta Sans', sans-serif;
	font-size: 0.95rem;
	outline: none;
	resize: vertical;
	min-height: 70px;
	transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
textarea.bookshelf-textarea:focus {
	border-color: var(--accent-primary);
	box-shadow: 0 0 0 3px rgba(197, 137, 64, 0.15);
}
</style>
</head>
<body class="customer-bookshelf-body" onload="funload()">
	<header class="bookshelf-header-wrap">
		<nav class="navbar-bookshelf">
			<a class="brand" href="index.html">BOOKS</a>
			<div class="pill-tabs">
				<a href="index.html">Home</a>
				<a href="CustomerLogin.html">Login</a>
				<a href="CustomerRegister.html" class="active">Register</a>
			</div>
			<div class="nav-icon-group">
				<a href="CustomerLogin.html" class="nav-pill-btn" style="font-size:0.82rem;">Sign In &rarr;</a>
			</div>
		</nav>
	</header>

	<div class="bookshelf-auth-wrap" style="max-width: 540px;">
		<div class="bookshelf-page-card">
			<header class="bookshelf-page-header" style="text-align:center;">
				<h1>Create Account</h1>
				<p>Register as a member to explore books and enjoy exclusive recommendations.</p>
			</header>

			<form action="userreg" method="post">
				<div class="register-grid-2">
					<div class="bookshelf-input-group">
						<label for="firstName">First Name</label>
						<input type="text" name="firstname" id="firstName" placeholder="John" required>
					</div>
					<div class="bookshelf-input-group">
						<label for="lastName">Last Name</label>
						<input type="text" name="lastname" id="lastName" placeholder="Doe" required>
					</div>
				</div>

				<div class="bookshelf-input-group">
					<label for="Email">Email Address</label>
					<input type="email" name="mailid" id="Email" placeholder="john@example.com" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="passWord">Password</label>
					<input type="password" name="password" id="passWord" placeholder="Create a strong password" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="phno">Mobile Phone</label>
					<input type="tel" name="phone" id="phno" placeholder="e.g. +1 234 567 890" required>
				</div>

				<div class="bookshelf-input-group">
					<label for="address">Shipping Address</label>
					<textarea name="address" id="address" class="bookshelf-textarea" placeholder="Enter your full street address" required></textarea>
				</div>

				<label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin: 12px 0 20px; font-size:0.88rem; color:var(--text-secondary);">
					<input type="checkbox" name="acceptance" required checked>
					I accept all Terms &amp; Conditions
				</label>

				<button class="btn-auth-submit" type="submit">Complete Registration</button>

				<div class="auth-switch-link">
					Already have an account? <a href="CustomerLogin.html">Sign in here</a>
				</div>
			</form>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
	<script>
		function funload() {
			// Ready
		}
	</script>
</body>
</html>
