<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="ISO-8859-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal — Online Book Store</title>
<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="manifest" href="./favicons/site.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/bookshelf-theme.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
	var activeTab = 'home';
</script>
</head>
<body class="customer-bookshelf-body">
	<header class="bookshelf-header-wrap">
		<nav class="navbar-bookshelf">
			<a class="brand" href="index.html">BOOKS <span style="font-size:0.75rem; font-family:'Plus Jakarta Sans',sans-serif; background:var(--accent-soft); color:var(--accent-hover); padding:3px 8px; border-radius:999px; margin-left:4px;">ADMIN</span></a>

			<div class="pill-tabs">
				<a href="index.html" id="home">Home</a>
				<a href="storebooks" id="storebooks">Store Books</a>
				<a href="addbook" id="addbook">Add Book</a>
				<a href="removebook" id="removebook">Remove Book</a>
				<a href="orders" id="orders">Orders List</a>
			</div>

			<div class="nav-icon-group">
				<a href="logout" id="logout" class="nav-pill-btn nav-logout-btn" title="Logout">
					<span class="nav-avatar" style="background: linear-gradient(135deg, #c58940, #ae7634);"></span>
					<span>Logout</span>
				</a>
			</div>
		</nav>
	</header>

	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
	<script>
		if (typeof activeTab !== 'undefined' && document.getElementById(activeTab)) {
			document.getElementById(activeTab).classList.add("active");
		}
	</script>
</body>
</html>
